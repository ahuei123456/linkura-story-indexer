[project]
name = "linkura-story-indexer"
version = "0.1.0"
description = "Scripts to index the LLLL story"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.34.0",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[google,openai]>=2.66.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
    "sudachipy>=0.7.0",
    "sudachidict-core>=20261015",
]

[project.scripts]
indexer = "linkura_story_indexer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkura_story_indexer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
